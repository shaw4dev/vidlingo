# Local stack: the whole VidLingo app + Postgres (tasks.md T09/T10).
#   docker compose up --build   -> http://localhost:8000  (client + API)
#   SEED_ON_START=1 docker compose up --build   -> also loads the demo lesson/user
# Config via .env (see .env.example).
#
# This runs the same image that gets deployed — one container serving the built
# client and the API against a real Postgres, not SQLite. So "works in compose"
# is a genuine rehearsal for production rather than a different arrangement of
# the same parts.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidlingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidlingo}
      POSTGRES_DB: ${POSTGRES_DB:-vidlingo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidlingo} -d ${POSTGRES_DB:-vidlingo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  app:
    # Repo root: the build needs backend/ and web/ (see Dockerfile).
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vidlingo}:${POSTGRES_PASSWORD:-vidlingo}@db:5432/${POSTGRES_DB:-vidlingo}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      SEED_ON_START: ${SEED_ON_START:-0}
      # Optional. Without them the API still runs: on-demand word backfill
      # no-ops silently, and auto-ingested lessons get placeholder translations.
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
