# Render Blueprint (tasks.md T10) — the deployed topology, in the repo.
#
# One Docker service. The image built by ./Dockerfile contains the built web
# client and the API, so Render's only job is to run the same container that
# runs locally under `docker compose up`. Nothing about the app is
# Render-specific: moving to Fly, Cloud Run or a VPS means running this image
# somewhere else and setting the same three environment variables.
#
# The database is deliberately not declared here. Render deletes free Postgres
# instances 30 days after creation, which is the wrong failure mode for a link
# on a CV, so DATABASE_URL points at an external managed Postgres (Neon) whose
# free tier persists. Swapping providers is one environment variable.
#
# Deploy: Render dashboard -> Blueprints -> point at this repo. The `sync: false`
# values are entered once in the dashboard and never committed.
#
# Note on the free plan: an idle instance is spun down and the next request pays
# a cold start of roughly a minute. That is the cost of not putting the client
# on a CDN separately; the tradeoff bought a single artifact that is identical
# in development and production.

services:
  - type: web
    name: vidlingo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # postgresql+psycopg://USER:PASSWORD@HOST/DB?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Optional: the Chinese gloss on the word card. Absent -> English senses.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: on-demand word backfill. Absent -> that feature no-ops.
      - key: YOUTUBE_API_KEY
        sync: false
