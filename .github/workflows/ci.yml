name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

      - name: Validate sample content packages
        run: python -m app.content.validate samples/lesson_package.sample.json

      - name: Migrations + seed (SQLite smoke test)
        run: |
          alembic upgrade head
          python -m app.db.seed

      - name: Build check (app imports)
        run: python -c "from app.main import app; print('app ok:', app.title)"

  web:
    name: Web (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this is the type check too.
      - name: Typecheck + build
        run: npm run build

  image:
    name: Image (build · smoke test)
    runs-on: ubuntu-latest
    # The image is the deployable artifact, so "it builds" is not enough: this
    # runs the container the way a host would and checks it actually answers.
    # Catches the class of failure that otherwise only shows up in a deploy log.
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t vidlingo:ci .

      - name: Run it
        run: |
          docker run -d --name vidlingo \
            -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            -e SEED_ON_START=1 \
            vidlingo:ci

      - name: Wait for the health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "never became healthy:"; docker logs vidlingo; exit 1

      - name: It serves the API
        run: curl -fsS http://localhost:8000/api/lessons | grep -q '"id"'

      - name: It serves the client, including deep links
        run: |
          curl -fsS http://localhost:8000/ | grep -qi '<div id="root"'
          # /vocab is both a client page and an API endpoint. A browser
          # navigating there must get the app; the API lives at /api/vocab.
          curl -fsS -H 'Accept: text/html' http://localhost:8000/vocab | grep -qi '<div id="root"'
          curl -fsS -H 'Accept: text/html' http://localhost:8000/reader/yt_x | grep -qi '<div id="root"'

      - name: Logs on failure
        if: failure()
        run: docker logs vidlingo
